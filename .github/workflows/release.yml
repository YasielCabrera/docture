name: Release packages

on:
  workflow_dispatch:
    inputs:
      bump:
        description: auto reads the Unreleased changelog sections; none publishes the version already committed
        required: true
        default: auto
        type: choice
        options: [auto, minor, patch, none]
      publish:
        description: Push the version commit and tag, then stage the packages on npm. Leave off for a rehearsal.
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      sha: ${{ steps.version.outputs.sha }}
      bundled: ${{ inputs.bump != 'none' }}
    steps:
      - name: Require main for a version bump
        if: inputs.bump != 'none' && github.ref != 'refs/heads/main'
        run: |
          echo "::error::Run a release that changes the version from main. Use bump=none to publish a tag or commit that is already versioned."
          exit 1
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Set the release version
        id: version
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          if [ "$BUMP" = none ]; then
            version=$(node -p "require('./packages/docture/package.json').version")
          else
            version=$(node scripts/version-packages.mjs "$BUMP")
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --all --message "chore: release $version"
            git bundle create "$RUNNER_TEMP/release.bundle" HEAD^..HEAD
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "Releasing $version" >> "$GITHUB_STEP_SUMMARY"
      - if: inputs.bump != 'none'
        uses: actions/upload-artifact@v7
        with:
          name: release-commit
          path: ${{ runner.temp }}/release.bundle
          retention-days: 1

  lint:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/release-setup
        with:
          sha: ${{ needs.prepare.outputs.sha }}
          bundled: ${{ needs.prepare.outputs.bundled }}
      - run: pnpm lint

  build:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SITE_URL: https://docture.test
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/release-setup
        with:
          sha: ${{ needs.prepare.outputs.sha }}
          bundled: ${{ needs.prepare.outputs.bundled }}
      - run: pnpm typecheck
      - run: pnpm build

  test:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/release-setup
        with:
          sha: ${{ needs.prepare.outputs.sha }}
          bundled: ${{ needs.prepare.outputs.bundled }}
      - run: pnpm --filter @docture/docs exec playwright-core install --with-deps chromium
      - run: pnpm test --concurrency=1

  verify:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/release-setup
        with:
          sha: ${{ needs.prepare.outputs.sha }}
          bundled: ${{ needs.prepare.outputs.bundled }}
      - run: pnpm verify:packages --output-dir "$RUNNER_TEMP/verified"
      - run: node scripts/stage-packages.mjs --verified "$RUNNER_TEMP/verified" --dry-run
      - uses: actions/upload-artifact@v7
        with:
          name: verified-packages
          path: |
            ${{ runner.temp }}/verified/summary.json
            ${{ runner.temp }}/verified/tarballs
          retention-days: 7

  stage:
    needs: [prepare, lint, build, test, verify]
    if: inputs.publish
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: npm
    permissions:
      contents: write
      id-token: write
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      TAG: docture@${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/release-setup
        with:
          sha: ${{ needs.prepare.outputs.sha }}
          bundled: ${{ needs.prepare.outputs.bundled }}
          install: "false"
      - uses: actions/download-artifact@v8
        with:
          name: verified-packages
          path: ${{ runner.temp }}/verified

      - name: Push the version commit
        if: inputs.bump != 'none'
        run: git push origin HEAD:main

      - name: Tag the release
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" > /dev/null; then
            echo "$TAG already exists."
          else
            git tag "$TAG"
            git push origin "refs/tags/$TAG"
          fi

      # A version that is already published or staged is skipped, so a failed run can be repeated with bump=none.
      - name: Stage the verified packages on npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          node scripts/stage-packages.mjs --verified "$RUNNER_TEMP/verified" --provenance
          echo "Approve the staged versions under Staged Packages on npmjs.com to publish them." >> "$GITHUB_STEP_SUMMARY"

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "The release for $TAG already exists."
            exit 0
          fi
          notes="\`docture\`, \`@docture/cli\`, \`@docture/eval\`, and \`@docture/synthetic\` $VERSION."
          for folder in docture cli eval synthetic; do
            notes="$notes"$'\n'"- [$folder changelog](https://github.com/$GITHUB_REPOSITORY/blob/$TAG/packages/$folder/CHANGELOG.md)"
          done
          gh release create "$TAG" --title "$VERSION" --notes "$notes" --verify-tag
