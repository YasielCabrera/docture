name: Setup
description: Install pnpm, Node, and the workspace dependencies for one job.

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v5
      with:
        version: 10.33.0
    - uses: actions/setup-node@v6
      with:
        node-version: 22
        cache: pnpm
    - shell: bash
      run: pnpm install --frozen-lockfile
